<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<title>Ian Vocabulary</title>
<style>
:root{--bg:#0b0d10;--card:#15191f;--card2:#1b2028;--text:#f5f7fa;--muted:#9299a3;--line:#2b313a;--blue:#4b9cff;--yellow:#ffd66b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
body{min-height:100vh}.app{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 95px)}
h1{font-size:34px;line-height:1;margin:8px 0}.lead{color:var(--muted);margin-bottom:22px}
nav{display:flex;gap:8px;margin-bottom:18px;overflow:auto}button,input,select{font:inherit}
button{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:14px;padding:12px 14px;font-weight:750}
button.on,button.primary{background:var(--blue);border-color:var(--blue);color:white}
input,select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:15px;padding:15px}
.grid{display:grid;grid-template-columns:1fr 145px;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:16px}
.word{font-size:38px;font-weight:850}.tag{font-size:12px;color:var(--muted)}.section{margin-top:21px}.label{font-size:11px;font-weight:850;letter-spacing:.11em;color:var(--muted);text-transform:uppercase;margin-bottom:7px}
.big{font-size:20px;line-height:1.55}.core{font-size:20px;line-height:1.55;font-weight:750}.example{font-size:20px;line-height:1.55;font-style:italic}.jp{font-size:22px;line-height:1.5;font-weight:800;color:var(--yellow)}
.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:13px}.err{color:#ff7b72;margin-top:10px;white-space:pre-wrap}
.saved{padding:14px 0;border-bottom:1px solid var(--line)}.saved:last-child{border:0}.savedWord{font-size:20px;font-weight:800}
.note{padding:13px;background:#10141a;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px;line-height:1.5;margin-top:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<h1>Vocabulary</h1>
<div class="lead">Understand in English first. Japanese comes last.</div>

<nav>
<button id="navSearch" class="on">Search</button>
<button id="navSaved">Saved</button>
<button id="navSettings">Settings</button>
</nav>

<section id="viewSearch">
<div class="grid">
<input id="q" placeholder="Type an English word or phrase" autocapitalize="none" autocomplete="off">
<select id="ctx">
<option>Everyday</option>
<option>Work</option>
<option>Dating</option>
<option>Travel</option>
</select>
</div>

<div style="height:10px"></div>
<button class="primary" id="go" style="width:100%">✨ Search</button>
<div id="status" class="muted small" style="margin-top:10px"></div>
<div id="error" class="err"></div>

<div id="result" class="card hidden">
<div style="display:flex;justify-content:space-between;gap:12px;align-items:start">
<div id="word" class="word"></div>
<div id="contextTag" class="tag"></div>
</div>

<div class="section">
<div class="label">Meaning in simple English</div>
<div id="simple" class="big"></div>
</div>

<div class="section">
<div class="label">コアイメージ</div>
<div id="core" class="core"></div>
</div>

<div class="section">
<div class="label">Natural example</div>
<div id="example" class="example"></div>
</div>

<div class="section">
<button id="reveal" style="width:100%">👁 タップして日本語の意味を見る</button>
<div id="japanese" class="jp hidden" style="margin-top:14px"></div>
</div>
</div>
</section>

<section id="viewSaved" class="hidden">
<input id="savedQ" placeholder="Search saved words">
<div id="savedList" class="card"></div>
</section>

<section id="viewSettings" class="hidden">
<div class="card">
<div class="label">AI Proxy URL</div>
<input id="endpoint" placeholder="https://your-proxy.example.com">
<button id="saveEndpoint" class="primary" style="width:100%;margin-top:10px">Save</button>
<div class="note">
AIを使う場合だけ設定します。OpenAIの秘密APIキーをこのページへ直接入力しないでください。中継APIのURLだけを設定します。
</div>
</div>

<div class="card">
<div class="label">Backup</div>
<button id="exportBtn">Copy vocabulary backup</button>
<div class="note">
検索済みの単語はこのiPhoneのブラウザ内に保存されます。Safariのサイトデータを削除すると消える可能性があります。
</div>
</div>
</section>
</div>

<script>
const EKEY="ian_vocab_single_v1";
const PKEY="ian_vocab_proxy_v1";
const $=id=>document.getElementById(id);

const views={
  Search:$("viewSearch"),
  Saved:$("viewSaved"),
  Settings:$("viewSettings")
};

function tab(name){
  Object.entries(views).forEach(([k,v])=>v.classList.toggle("hidden",k!==name));
  ["Search","Saved","Settings"].forEach(k=>$("nav"+k).classList.toggle("on",k===name));
  if(name==="Saved") renderSaved();
}

$("navSearch").onclick=()=>tab("Search");
$("navSaved").onclick=()=>tab("Saved");
$("navSettings").onclick=()=>tab("Settings");

function entries(){
  try{return JSON.parse(localStorage.getItem(EKEY)||"[]")}
  catch{return[]}
}

function store(list){
  localStorage.setItem(EKEY,JSON.stringify(list));
}

function norm(s){
  return String(s||"").trim().toLowerCase();
}

function findEntry(word,context){
  return entries().find(x=>norm(x.word)===norm(word)&&x.context===context);
}

function saveEntry(x){
  let list=entries();
  const i=list.findIndex(v=>norm(v.word)===norm(x.word)&&v.context===x.context);
  if(i>=0) list[i]=x;
  else list.unshift(x);
  store(list);
}

function display(x){
  $("word").textContent=x.word;
  $("contextTag").textContent=x.context;
  $("simple").textContent=x.shortEnglish;
  $("core").textContent=x.coreImageJapanese;
  $("example").textContent=x.exampleEnglish;
  $("japanese").textContent=x.meaningJapanese;
  $("japanese").classList.add("hidden");
  $("reveal").textContent="👁 タップして日本語の意味を見る";
  $("result").classList.remove("hidden");
}

$("reveal").onclick=()=>{
  const hidden=$("japanese").classList.toggle("hidden");
  $("reveal").textContent=hidden
    ?"👁 タップして日本語の意味を見る"
    :"🙈 日本語を隠す";
};

$("q").addEventListener("keydown",e=>{
  if(e.key==="Enter") lookup();
});

$("go").onclick=lookup;

async function lookup(){
  const word=$("q").value.trim();
  const context=$("ctx").value;
  if(!word) return;

  $("error").textContent="";

  const cached=findEntry(word,context);
  if(cached){
    $("status").textContent="Saved result";
    display(cached);
    return;
  }

  const url=localStorage.getItem(PKEY)||"";
  if(!url){
    $("error").textContent="AI検索を使うには Settings で AI Proxy URL を設定してください。";
    return;
  }

  $("go").disabled=true;
  $("status").textContent="AI is creating a natural example…";

  try{
    const res=await fetch(url,{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({word,context})
    });

    const text=await res.text();
    if(!res.ok) throw new Error(text);

    const x=JSON.parse(text);
    x.context=context;
    x.createdAt=Date.now();

    saveEntry(x);
    display(x);
    $("status").textContent="Saved on this device";
  }catch(e){
    $("error").textContent="AI error: "+e.message;
  }finally{
    $("go").disabled=false;
  }
}

function safe(s){
  return String(s??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[m]));
}

function renderSaved(){
  const q=norm($("savedQ").value);
  const list=entries().filter(x=>
    !q ||
    norm(x.word).includes(q) ||
    norm(x.shortEnglish).includes(q) ||
    String(x.meaningJapanese).includes(q)
  );

  $("savedList").innerHTML=list.length
    ?list.map((x,i)=>`
      <div class="saved" data-i="${i}">
        <div class="savedWord">${safe(x.word)}</div>
        <div class="muted small">${safe(x.context)} · ${safe(x.shortEnglish)}</div>
      </div>
    `).join("")
    :`<div class="muted">No saved words yet.</div>`;

  [...$("savedList").querySelectorAll(".saved")].forEach((el,i)=>{
    el.onclick=()=>{
      const x=list[i];
      tab("Search");
      $("q").value=x.word;
      $("ctx").value=x.context;
      display(x);
    };
  });
}

$("savedQ").oninput=renderSaved;

$("endpoint").value=localStorage.getItem(PKEY)||"";

$("saveEndpoint").onclick=()=>{
  localStorage.setItem(PKEY,$("endpoint").value.trim());
  alert("Saved");
};

$("exportBtn").onclick=async()=>{
  const text=JSON.stringify(entries(),null,2);
  try{
    await navigator.clipboard.writeText(text);
    alert("Backup copied");
  }catch{
    prompt("Copy this backup:",text);
  }
};
</script>
</body>
</html>
